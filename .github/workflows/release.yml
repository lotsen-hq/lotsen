name: Release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, such as v0.1.0, or v0.1.0-rc.1 for a pre-release
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TAG: ${{ inputs.version }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # Reads the conclusion of the commit's CI run.
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the version's format
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The version must look like v1.2.3 or v1.2.3-rc.1 (got: $TAG)."
            exit 1
          fi

      - name: Require a run from main
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Start the release from main (got: $GITHUB_REF)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The plugin at the release's tag starts the npm version that plugin/.mcp.json names, so it must be the one that this release publishes.
      - name: Require plugin/.mcp.json to start this version
        run: node npm/check-release-version.mjs "$TAG"

      # A stable release publishes its section of CHANGELOG.md as the release's notes, and the summary shows them to the reviewer who approves the npm job. A pre-release gets GitHub's
      # generated notes.
      - name: Write the release notes
        if: ${{ !contains(inputs.version, '-') }}
        run: |
          node npm/release-notes.mjs "$TAG" > release-notes.md
          { echo "## Release notes of $TAG"; echo; cat release-notes.md; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !contains(inputs.version, '-') }}
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

      - name: Require passing CI on this commit
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA" --jq '.workflow_runs | sort_by(.created_at) | last')
          if [[ -z "$latest" || "$latest" == "null" ]]; then
            echo "::error::$GITHUB_SHA has no CI run, as when its push changed only notes and docs. Start one with 'gh workflow run ci --ref main', wait for it to pass, then start the release again."
            exit 1
          fi
          state="$(jq -r .status <<<"$latest")/$(jq -r .conclusion <<<"$latest")"
          if [[ "$state" != "completed/success" ]]; then
            echo "::error::CI on $GITHUB_SHA is $state. Release only a commit whose CI passed."
            exit 1
          fi

      - name: Refuse a version that already has a tag
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" | jq --arg ref "refs/tags/$TAG" 'map(select(.ref == $ref)) | length')
          if [[ "$count" != "0" ]]; then
            echo "::error::The tag $TAG already exists."
            exit 1
          fi

  build:
    needs: check
    strategy:
      matrix:
        include:
          - { rid: linux-x64, runner: ubuntu-latest, executable: lotsen, asset: lotsen-linux-x64 }
          - { rid: win-x64, runner: windows-latest, executable: lotsen.exe, asset: lotsen-win-x64.exe }
    runs-on: ${{ matrix.runner }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      PUBLISH: src/Lotsen/bin/Release/net11.0/${{ matrix.rid }}/publish
      EXECUTABLE: ${{ matrix.executable }}
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # Native AOT links with clang and zlib.
      - name: Install native toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Strip the v from the version
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      # The publish embeds ui/dist and fails without it.
      - name: Build UI
        working-directory: ui
        run: npm run build

      # Warnings are errors, so any AOT or trim warning fails the publish.
      - name: Publish with Native AOT
        run: dotnet publish -c Release -p:PublishAot=true -p:TreatWarningsAsErrors=true -p:Version="$VERSION"

      - name: Check that the publish holds the executable alone
        run: |
          ls -la "$PUBLISH"
          files=$(find "$PUBLISH" -mindepth 1)
          if [ "$files" != "$PUBLISH/$EXECUTABLE" ]; then
            echo "::error::Expected only $EXECUTABLE in $PUBLISH."
            exit 1
          fi

      - name: Check that the executable reports the version
        run: |
          actual=$("$PUBLISH/$EXECUTABLE" --version)
          echo "$actual"
          case "$actual" in
            "$VERSION+"*) ;;
            *)
              echo "::error::Expected a version that starts with $VERSION+."
              exit 1
              ;;
          esac

      - name: Name the executable after its platform
        run: mkdir asset && cp "$PUBLISH/$EXECUTABLE" "asset/$ASSET"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: asset/${{ matrix.asset }}
          if-no-files-found: error

  npm:
    needs: build
    # The npm environment's required reviewer approves the release here, before anything public: the npm packages, the tag, the GitHub release and the marketplace entry. Read the
    # release notes in the check job's summary, and try the executables from the run's artifacts, before approving.
    environment: npm
    # Trusted publishing proves the run to npm through OIDC, so no npm token exists, and this job cannot write to the repository: https://docs.npmjs.com/trusted-publishers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require npm 11.5.1 or later, which trusted publishing needs
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              console.error(`::error::Trusted publishing needs npm 11.5.1 or later, and the runner has ${process.argv[1]}.`);
              process.exit(1);
            }' "$(npm --version)"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          pattern: lotsen-*
          merge-multiple: true

      - name: Strip the v from the version
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Pack the packages
        run: node npm/pack.mjs "$VERSION" packs linux-x64=assets/lotsen-linux-x64 win32-x64=assets/lotsen-win-x64.exe | tee tarballs.txt

      # The platforms go first, so the package lotsen never names a version that npm lacks. A rerun after a partial failure skips each package that npm holds at this version.
      - name: Publish the packages
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then
            flags+=(--tag next)
          fi
          while read -r tarball; do
            name=$(tar -xzOf "$tarball" package/package.json | jq -r .name)
            if npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "$name@$VERSION is on npm already."
            else
              npm publish "$tarball" "${flags[@]}"
            fi
          done < tarballs.txt

  attest:
    needs: npm
    # Each executable gets a provenance attestation that this workflow built it at this commit, which `gh attestation verify` checks. Trusted publishing gives the npm packages their
    # own: https://docs.npmjs.com/trusted-publishers#automatic-provenance-generation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          pattern: lotsen-*
          merge-multiple: true

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: assets/lotsen-*

  publish:
    needs: attest
    # Only this job's token can write to the repository, so it runs nothing from the packages that the build installs.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          pattern: lotsen-*
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !contains(inputs.version, '-') }}
        with:
          name: release-notes

      # The checksum file lets anyone who downloads an executable by hand check it.
      - name: Write the checksum file
        working-directory: assets
        run: sha256sum lotsen-* | tee checksums.txt

      # The release creates the tag at the commit that the checks passed, so a failed build leaves no tag.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG")
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease --generate-notes)
          else
            flags+=(--notes-file release-notes.md)
          fi
          gh release create "$TAG" assets/* "${flags[@]}"

  marketplace:
    needs: publish
    # The marketplace serves every user, so a pre-release stays off it, as it stays off npm's latest.
    if: ${{ !contains(inputs.version, '-') }}
    runs-on: ubuntu-latest
    # Only a run from main gets the environment's deploy key, which can write to lotsen-hq/plugins alone.
    environment: release
    permissions: {}
    steps:
      - name: Pin the marketplace entry to the release
        env:
          DEPLOY_KEY: ${{ secrets.MARKETPLACE_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/marketplace
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/marketplace -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

          git clone --depth 1 git@github.com:lotsen-hq/plugins.git plugins
          cd plugins
          file=.claude-plugin/marketplace.json
          if ! jq -e '[.plugins[] | select(.name == "lotsen")] | length == 1' "$file" > /dev/null; then
            echo "::error::$file has no single entry named lotsen."
            exit 1
          fi
          jq --arg tag "$TAG" '(.plugins[] | select(.name == "lotsen") | .source.ref) = $tag' "$file" > "$file.new"
          mv "$file.new" "$file"

          # A rerun after the push finds the entry pinned already.
          if git diff --quiet; then
            echo "The marketplace entry pins $TAG already."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -am "Pin the lotsen entry to $TAG"
          git push -q origin HEAD
